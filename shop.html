<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Shop</title>
  <meta name="description" content="Shop — Original works and exclusive merchandise">

  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- Shopify Buy Button Storefront SDK -->
  <script type="text/javascript">
    (function () {
      var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';
      if (window.ShopifyBuy) {
        if (window.ShopifyBuy.UI) { window.shopifySDKReady = true; }
        else { loadScript(); }
      } else { loadScript(); }
      function loadScript() {
        var script = document.createElement('script');
        script.async = true;
        script.src = scriptURL;
        (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(script);
        script.onload = function() {
          window.shopifySDKReady = true;
          if (window.onShopifySDKReady) window.onShopifySDKReady();
        };
      }
    })();
  </script>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <nav class="nav scrolled" id="nav">
    <div class="container nav__inner">
      <a href="/" class="nav__logo" id="nav-logo">Studio</a>

      <ul class="nav__links" id="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/shop.html" class="active">Shop</a></li>
      </ul>

      <button class="nav__hamburger" id="nav-hamburger" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <section class="shop-hero">
    <div class="container">
      <h1 class="shop-hero__title" id="shop-hero-title">Shop</h1>
      <p class="shop-hero__subtitle" id="shop-hero-subtitle">Original works and exclusive merchandise</p>
    </div>
  </section>

  <!-- In-Person Pieces Section (Direct Shopify Checkout) -->
  <section class="section" id="in-person-section">
    <div class="container">
      <div class="section__header">
        <h2 class="section__title" id="in-person-title">Original Works</h2>
        <p class="section__subtitle" id="in-person-subtitle">One-of-a-kind pieces — ships directly from the studio</p>
        <div class="section__divider"></div>
      </div>

      <div class="product-grid" id="in-person-grid"></div>
    </div>
  </section>

  <!-- Print On Demand Section (Direct Shopify Checkout) -->
  <section class="section pod-section" id="pod-section">
    <div class="container">
      <div class="section__header">
        <h2 class="section__title" id="pod-title">Merchandise</h2>
        <p class="section__subtitle" id="pod-subtitle">Print-on-demand — ships worldwide</p>
        <div class="section__divider"></div>
      </div>

      <div class="product-grid" id="pod-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer__socials" id="footer-socials"></div>
      <p class="footer__text" id="footer-text">&copy; Studio. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initSite('shop');
    });
  </script>
</body>
</html>
