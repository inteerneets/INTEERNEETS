<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found – INTEERNEETS</title>
  <!-- Error page. Cloudflare Pages / Netlify serve this file automatically for any unknown address.
       Its design is edited in /admin/ via the "Error Page" tab (saved as content/page-404.json). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@100..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root { --c-bg: #0a0a0a; --c-text: #ffffff; --c-highlight: #e53935; --c-button: #e53935; --c-button-text: #ffffff;
      --btn-fill: transparent; --btn-text: #000000; --btn-border: #000000; --btn-border-width: 2px; --btn-radius: 0px;
      --btn-hover-fill: var(--btn-fill); --btn-shadow: drop-shadow(0 6px 16px rgba(0,0,0,.28)); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--c-bg); color: var(--c-text); min-height: 100vh; font-family: 'Inter', sans-serif; }
    #bg { position: fixed; inset: 0; z-index: 0; background-color: var(--c-bg); background-repeat: no-repeat; background-position: center; background-size: cover; }
    #bg .ov { position: absolute; inset: 0; background: #000; opacity: 0; }
    #err { position: relative; z-index: 1; min-height: 100vh; }
    /* Presentation site: no text selection and no I-beam cursor (links/buttons keep their pointer) */
    html, body, body * { -webkit-user-select: none; user-select: none; cursor: default; -webkit-tap-highlight-color: transparent; }
    a, a *, button, button *, [role="button"], select, label, summary { cursor: pointer; }
    input, textarea { -webkit-user-select: text; user-select: text; cursor: text; }
    img { -webkit-user-drag: none; user-drag: none; }


    /* Glass scrollbar: the browser's bar is hidden and replaced by a see-through, blurred "glass" pill */
    @media (pointer: fine) {
      html { scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar { display: none; width: 0; height: 0; }
    }
    #gscroll { position: fixed; top: 0; right: 0; bottom: 0; width: 26px; z-index: 9000; pointer-events: none; }
    #gscroll .gs-thumb {
      position: absolute; right: 6px; width: 8px; top: 0; height: 60px; border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.12));
      border: 1px solid rgba(255,255,255,.42);
      -webkit-backdrop-filter: blur(10px) saturate(1.7); backdrop-filter: blur(10px) saturate(1.7);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.55), inset 0 0 8px rgba(255,255,255,.18), 0 4px 18px rgba(0,0,0,.28);
      opacity: 0; pointer-events: auto; cursor: grab !important; touch-action: none;
      transition: opacity .5s ease, width .2s ease, right .2s ease, background .2s ease;
    }
    #gscroll.active .gs-thumb, #gscroll .gs-thumb:hover, #gscroll.drag .gs-thumb { opacity: 1; }
    #gscroll .gs-thumb:hover, #gscroll.drag .gs-thumb { width: 12px; right: 4px; }
    #gscroll.drag .gs-thumb { cursor: grabbing !important; }
    #gscroll.off { display: none; }
  </style>
  <style id="page-fonts"></style>
  <script src="/glass-scroll.js?v=20261024d"></script>
</head>
<body>
  <div id="bg"></div>
  <main id="err"></main>
  <script>
    var LOCAL = ['localhost', '127.0.0.1'].indexOf(location.hostname) !== -1;

    function getContent(name) {
      function stat() {
        return fetch('/content/' + name, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); });
      }
      if (LOCAL) return stat();
      return fetch('/api/content?name=' + encodeURIComponent(name), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw 0; return r.json(); }).catch(stat);
    }

    // Scope the saved CSS to #err so it cannot leak (same approach as index.html)
    // A page's background is controlled only by its Page BG setting, so drop any
    // background that old designs painted on the page itself (html/body or full-page sections).
    var THEME_BG = /background(?:-color)?\s*:\s*var\(--c-bg[^;}]*;?/gi;
    function stripBg(css) { return css ? migrateBtnCss(normBtn(css.replace(THEME_BG, ''))) : css; }
    // Buttons are found in the saved CSS text (rules that use the --btn-* variables), so a button that
    // also has its own background/shadow settings still gets the hover shadow and the see-through shadow.
    function migrateBtnCss(css) {
      return String(css).replace(/([^{}]+)\{([^}]*)\}/g, function (m, sel, body) {
        if (body.indexOf('--btn-') === -1) return m;
        body = body.replace(/box-shadow\s*:\s*([^;]+)(;|$)/i, function (mm, v) {
          return v.trim() === 'none' ? mm : 'filter:' + toFilterShadow(v) + ';box-shadow:none;';
        });
        return sel + '{' + body + '}';
      });
    }
    function btnExtraCss(css, scope) {
      var out = '';
      String(css).replace(/([^{}]+)\{([^}]*)\}/g, function (m, sel, body) {
        if (body.indexOf('--btn-') === -1) return m;
        var sels = sel.trim().split(',').map(function (s) { return scope + ' ' + s.trim(); });
        out += sels.map(function (s) { return ':where(' + s + ')'; }).join(',') + '{border-radius:var(--btn-radius,0);transition:filter .25s ease,background .25s ease,color .25s ease;}' +
          sels.map(function (s) { return s + ':hover'; }).join(',') + '{filter:var(--btn-shadow,none);background:var(--btn-hover-fill,var(--btn-fill,transparent));}';
        return m;
      });
      return out;
    }
    function normBtn(css) {
      return String(css)
        .replace(/border(-color)?\s*:\s*([\d.]+px\s+solid\s+)?var\(--c-button(?:,[^)]*)?\)/gi, function (m, c) {
          return c ? 'border-color:var(--btn-border,#000000)' : 'border:var(--btn-border-width,2px) solid var(--btn-border,#000000)';
        })
        .replace(/background(?:-color)?\s*:\s*var\(--c-button(?:,[^)]*)?\)/gi, 'background:var(--btn-fill,transparent)')
        .replace(/var\(--c-button-text(?:,[^)]*)?\)/gi, 'var(--btn-text,#000000)');
    }

    function dropBodyBg(style) {
      ['background', 'background-color', 'background-image'].forEach(function (p) { style.removeProperty(p); });
    }
    function toFilterShadow(v) {
      v = String(v || '').trim();
      if (!v || v === 'none') return 'none';
      if (/^drop-shadow\(/i.test(v)) return v;
      var col = /(rgba?\([^)]*\)|#[0-9a-fA-F]{3,8})/.exec(v);
      var rest = v.replace(col ? col[1] : '', '');
      var nums = (rest.match(/-?[\d.]+(?:px)?/g) || []).slice(0, 3).map(function (n) { return parseFloat(n) + 'px'; });
      while (nums.length < 3) nums.push('0px');
      return 'drop-shadow(' + nums.join(' ') + ' ' + (col ? col[1] : 'rgba(0,0,0,.3)') + ')';
    }
    // Old designs used a box-shadow on buttons (it can't show through a see-through button).
    // Convert it to a drop-shadow filter that follows the outline and text.
    function migrateBtnShadow(style) {
      var bs = style.getPropertyValue('box-shadow');
      if (bs && bs !== 'none' && !style.getPropertyValue('filter')) {
        style.setProperty('filter', toFilterShadow(bs));
        style.setProperty('box-shadow', 'none');
      }
    }
    function scopeRules(rules, scope, fonts) {
      var out = '';
      for (var i = 0; i < rules.length; i++) {
        var r = rules[i];
        if (r.type === 1) {
          var sels = r.selectorText.split(',').map(function (s) {
            s = s.trim();
            if (s === '*') return scope + ', ' + scope + ' *';
            if (/^(html|body)(?![\w-])/.test(s)) return s.replace(/^(html|body)/, scope);
            return scope + ' ' + s;
          });
          if (/^(html|body)$/i.test(r.selectorText.trim())) dropBodyBg(r.style);
          out += sels.join(',') + '{' + r.style.cssText + '}';
        } else if (r.type === 5) { fonts.push(r.cssText); }
        else if (r.type === 4) { out += '@media ' + r.conditionText + '{' + scopeRules(r.cssRules, scope, fonts) + '}'; }
        else { out += r.cssText; }
      }
      return out;
    }
    function scopeCss(css, scope, fonts) { return scopeCssCore(css, scope, fonts) + btnExtraCss(css, scope); }
    function scopeCssCore(css, scope, fonts) {
      var st = document.createElement('style');
      st.textContent = css;
      document.head.appendChild(st);
      var res = scopeRules(st.sheet.cssRules, scope, fonts);
      document.head.removeChild(st);
      return res;
    }

    function fallback() {
      return '<section style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;">' +
        '<h1 style="font-family:\'Playfair Display\',serif;font-size:7rem;color:var(--c-highlight);line-height:1;">404</h1>' +
        '<p style="margin:1rem 0 2rem;opacity:.7;">This page does not exist.</p>' +
        '<a href="/" style="background:var(--btn-fill);color:var(--btn-text);border:var(--btn-border-width) solid var(--btn-border);text-decoration:none;padding:.8rem 2rem;letter-spacing:.15em;font-size:.85rem;font-weight:600;">BACK HOME</a></section>';
    }

    function render(d) {
      var main = document.getElementById('err');
      main.innerHTML = d && d.html ? stripBg(d.html) : fallback();
      if (d && d.css) {
        var fonts = [];
        var st = document.createElement('style');
        st.textContent = scopeCss(stripBg(d.css), '#err', fonts);
        document.head.appendChild(st);
        document.getElementById('page-fonts').textContent = fonts.join('\n');
      }
      var bg = (d && d.bg) || {}, el = document.getElementById('bg');
      if (bg.color) el.style.backgroundColor = bg.color;
      if (bg.image) {
        el.style.backgroundImage = 'url("' + bg.image + '")';
        var mode = bg.mode || 'cover';
        if (mode === 'tile') { el.style.backgroundRepeat = 'repeat'; el.style.backgroundSize = (bg.tile_size || 256) + 'px'; }
        else { el.style.backgroundSize = mode === 'stretch' ? '100% 100%' : mode; }
        if (bg.position) el.style.backgroundPosition = bg.position;
      }
      var ov = document.createElement('div');
      ov.className = 'ov';
      ov.style.opacity = Math.max(0, Math.min(0.9, Number(bg.overlay) || 0));
      el.appendChild(ov);
    }

    getContent('settings.json').then(function (s) {
      var c = s.site_colors, map = { bg: '--c-bg', text: '--c-text', highlight: '--c-highlight', button: '--c-button', button_text: '--c-button-text',
        btn_fill: '--btn-fill', btn_text: '--btn-text', btn_border: '--btn-border', btn_border_width: '--btn-border-width',
        btn_radius: '--btn-radius', btn_hover_fill: '--btn-hover-fill', btn_shadow: '--btn-shadow' };
      if (c) Object.keys(map).forEach(function (k) { if (c[k]) document.documentElement.style.setProperty(map[k], k === 'btn_shadow' ? toFilterShadow(c[k]) : c[k]); });
    }).catch(function () {}).then(function () {
      return getContent('page-404.json').catch(function () { return null; });
    }).then(render);
  
    // ?? Phone fit: text that is too wide for a narrow screen (e.g. a huge heading) is shrunk
    // just enough to fit. Runtime only: nothing is saved, and desktop is left untouched.
    function fitTextToWidth(root) {
      var win = root.ownerDocument.defaultView;
      var els = root.querySelectorAll('h1,h2,h3,h4,h5,h6,p,a,span,li,button,div');
      Array.prototype.forEach.call(els, function (el) {
        if (el.hasAttribute('data-fit-size')) { el.style.fontSize = el.getAttribute('data-fit-size'); el.removeAttribute('data-fit-size'); }
      });
      if (win.innerWidth > 700) return;
      Array.prototype.forEach.call(els, function (el) {
        if (!el.textContent.trim() || el.children.length > 2) return;
        if (el.closest && el.closest('[contenteditable="true"]')) return;
        if (el.clientWidth <= 0) return;
        var avail = function () {
          var p = el.parentElement, w = win.innerWidth;
          if (p) { var cs = win.getComputedStyle(p); w = Math.min(w, p.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0)); }
          return w;
        };
        var tooWide = function () { return el.scrollWidth > avail() + 1 || el.getBoundingClientRect().width > avail() + 1; };
        if (!tooWide()) return;
        var fs = parseFloat(win.getComputedStyle(el).fontSize), n = 0;
        el.setAttribute('data-fit-size', el.style.fontSize || '');
        while (tooWide() && fs > 12 && n++ < 40) { fs *= 0.94; el.style.fontSize = fs + 'px'; }
      });
    }

    (function () {
      var root = document.getElementById('err'), t;
      function run() { clearTimeout(t); t = setTimeout(function () { fitTextToWidth(root); }, 80); }
      window.addEventListener('resize', run);
      new MutationObserver(run).observe(root, { childList: true, subtree: true });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
      window.addEventListener('load', run);
    })();
  
    // ?? Email Us: open the visitor's mail app with our address already filled in. If no mail
    // app opens (common on desktop), offer Gmail compose / copy address so it always works. ??
    (function () {
      var panel;
      function closePanel() { if (panel) { panel.remove(); panel = null; } }
      function showFallback(to, su, body) {
        closePanel();
        panel = document.createElement('div');
        panel.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:10000;background:rgba(10,10,10,.92);color:#fff;' +
          'padding:16px 20px;border-radius:8px;font:500 14px Inter,sans-serif;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;' +
          'box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:92vw;user-select:text;-webkit-user-select:text;';
        var msg = document.createElement('span');
        msg.textContent = 'No mail app opened? Write to ' + to + ':';
        function btn(label, fn) {
          var b = document.createElement('button');
          b.textContent = label;
          b.style.cssText = 'cursor:pointer;border:0;padding:9px 16px;border-radius:4px;font:600 13px Inter,sans-serif;letter-spacing:.06em;background:#fff;color:#000;';
          b.addEventListener('click', fn);
          return b;
        }
        var gmail = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(to) +
          (su ? '&su=' + encodeURIComponent(su) : '') + (body ? '&body=' + encodeURIComponent(body) : '');
        panel.appendChild(msg);
        panel.appendChild(btn('OPEN GMAIL', function () { window.open(gmail, '_blank', 'noopener'); closePanel(); }));
        panel.appendChild(btn('COPY ADDRESS', function (e) {
          var t = e.target;
          function done() { t.textContent = 'COPIED'; setTimeout(closePanel, 900); }
          if (navigator.clipboard) navigator.clipboard.writeText(to).then(done, done); else done();
        }));
        var x = btn('\u2715', closePanel);
        x.style.background = 'transparent'; x.style.color = '#aaa';
        panel.appendChild(x);
        document.body.appendChild(panel);
        setTimeout(closePanel, 20000);
      }
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href^="mailto:"]');
        if (!a) return;
        e.preventDefault();
        var u;
        try { u = new URL(a.getAttribute('href')); } catch (_) { return; }
        var to = decodeURIComponent(u.pathname), su = u.searchParams.get('subject') || '', body = u.searchParams.get('body') || '';
        var left = false;
        function gone() { left = true; }
        window.addEventListener('blur', gone, { once: true });
        document.addEventListener('visibilitychange', gone, { once: true });
        window.location.href = a.getAttribute('href');
        // Show the helper fast; if a mail app opens afterwards (window loses focus) it hides itself again
        setTimeout(function () {
          if (!left && !document.hidden) {
            showFallback(to, su, body);
            var hide = function () { closePanel(); window.removeEventListener('blur', hide); };
            window.addEventListener('blur', hide, { once: true });
            setTimeout(function () { window.removeEventListener('blur', hide); }, 6000);
          }
        }, 250);
      });
    })();
  
    // ?? Glass scrollbar (desktop / mouse only) ??
    (function () {
      if (!window.matchMedia || !window.matchMedia('(pointer: fine)').matches) return;
      var wrap = document.createElement('div');
      wrap.id = 'gscroll';
      wrap.innerHTML = '<div class="gs-thumb"></div>';
      document.body.appendChild(wrap);
      var thumb = wrap.firstChild, idle, ticking = false, dragging = false;
      function metrics() {
        var doc = document.documentElement, vh = window.innerHeight, h = Math.max(doc.scrollHeight, document.body.scrollHeight);
        var th = Math.max(54, Math.round(vh * vh / h));
        return { vh: vh, h: h, th: th, range: Math.max(1, vh - th - 12), max: Math.max(1, h - vh) };
      }
      function draw() {
        ticking = false;
        var m = metrics();
        wrap.classList.toggle('off', m.h <= m.vh + 2);
        thumb.style.height = m.th + 'px';
        thumb.style.top = (6 + (window.scrollY / m.max) * m.range) + 'px';
      }
      function request() { if (!ticking) { ticking = true; requestAnimationFrame(draw); } }
      function pulse() {
        wrap.classList.add('active');
        clearTimeout(idle);
        idle = setTimeout(function () { if (!dragging) wrap.classList.remove('active'); }, 900);
      }
      window.addEventListener('scroll', function () { request(); pulse(); }, { passive: true });
      window.addEventListener('resize', request);
      // moving the mouse to the right edge brings the bar back so it can be grabbed
      document.addEventListener('mousemove', function (e) { if (e.clientX > window.innerWidth - 40) pulse(); }, { passive: true });
      new MutationObserver(request).observe(document.body, { childList: true, subtree: true });
      window.addEventListener('load', request);
      thumb.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        var m = metrics(), startY = e.clientY, startScroll = window.scrollY;
        dragging = true; wrap.classList.add('drag', 'active');
        document.documentElement.style.scrollBehavior = 'auto';
        thumb.setPointerCapture(e.pointerId);
        function move(ev) { window.scrollTo(0, startScroll + (ev.clientY - startY) * (m.max / m.range)); }
        function up() {
          dragging = false; wrap.classList.remove('drag'); pulse();
          document.documentElement.style.scrollBehavior = '';
          thumb.removeEventListener('pointermove', move); thumb.removeEventListener('pointerup', up); thumb.removeEventListener('pointercancel', up);
        }
        thumb.addEventListener('pointermove', move); thumb.addEventListener('pointerup', up); thumb.addEventListener('pointercancel', up);
      });
      draw();
    })();
  </script>
  <script>glassScroll();</script>
</body>
</html>
