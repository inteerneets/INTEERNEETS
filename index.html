<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Coming Soon</title>
  <meta name="description" content="Coming Soon — Studio">

  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <nav class="nav" id="nav">
    <div class="container nav__inner">
      <a href="/" class="nav__logo" id="nav-logo">Studio</a>

      <ul class="nav__links" id="nav-links">
        <li><a href="/" class="active">Home</a></li>
        <li id="nav-shop-link"><a href="/shop.html">Shop</a></li>
      </ul>

      <button class="nav__hamburger" id="nav-hamburger" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <section class="hero" id="hero">
    <!-- Pure background image & optional shading overlay -->
    <div class="hero__bg" id="hero-bg"></div>
    <div class="hero__overlay" id="hero-overlay"></div>

    <!-- Freeform custom layers container (z-indexed text and images) -->
    <div id="hero-layers-container"></div>

    <div class="hero__content">
      <h1 class="hero__heading" id="hero-heading">Coming Soon</h1>
      <p class="hero__subtitle" id="hero-subtitle">We're working on something special. Stay tuned.</p>

      <!-- EMAIL US Button -->
      <a href="mailto:inteerneets@gmail.com" class="hero__cta" id="hero-cta">EMAIL US</a>

      <div class="hero__socials" id="hero-socials"></div>
    </div>
  </section>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initSite('home');
    });

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function(user) {
        if (!user) {
          window.netlifyIdentity.on("login", function() {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
