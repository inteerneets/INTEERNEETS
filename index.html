<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTEERNEETS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@100..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #0a0a0a; min-height: 100vh; }

    #loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading-screen.fade {
      opacity: 0;
      pointer-events: none;
    }
    #loading-screen span {
      font-family: 'Playfair Display', serif;
      color: #e53935;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
    }
  </style>
  <style id="page-styles"></style>
</head>
<body>
  <div id="loading-screen"><span>Loading...</span></div>
  <main id="page-content"></main>

  <script>
    function hideLoader() {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('fade');
        setTimeout(function() { loader.style.display = 'none'; }, 400);
      }
    }

    function applySettings(s) {
      s = s || {};
      // Flat color exactly as chosen. Shading overlay only if explicitly enabled.
      var c = s.site_colors || (s.site_bg_color ? { bg: s.site_bg_color } : null);
      if (c) {
        var map = { bg: '--c-bg', text: '--c-text', highlight: '--c-highlight', button: '--c-button', button_text: '--c-button-text' };
        Object.keys(map).forEach(function(k) { if (c[k]) document.documentElement.style.setProperty(map[k], c[k]); });
        if (c.bg) {
          document.documentElement.style.background = c.bg;
          document.body.style.background = c.bg;
          document.getElementById('loading-screen').style.background = c.bg;
        }
      }
      if (s.site_bg_shading) {
        var o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);pointer-events:none;z-index:1;';
        document.body.appendChild(o);
      }
    }

    function getJSON(url) {
      return fetch(url, { cache: 'no-store' }).then(function(res) {
        if (!res.ok) throw new Error('Not found');
        return res.json();
      });
    }

    Promise.all([
      getJSON('/content/page-home.json'),
      getJSON('/content/settings.json').catch(function() { return {}; })
    ])
      .then(function(r) {
        var data = r[0];
        applySettings(r[1]);
        document.getElementById('page-content').innerHTML = data.html || '';
        document.getElementById('page-styles').textContent = data.css || '';
        hideLoader();
      })
      .catch(function() {
        document.getElementById('page-content').innerHTML =
          '<section style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;color:#fff;font-family:\'Playfair Display\',serif;text-align:center;padding:2rem;">' +
            '<h1 style="font-size:3rem;color:#e53935;margin-bottom:1rem;">Coming Soon</h1>' +
            '<a href="mailto:inteerneets@gmail.com" style="color:#e53935;font-family:\'Inter\',sans-serif;text-decoration:none;border:1px solid #e53935;padding:0.75rem 2rem;letter-spacing:0.15em;font-size:0.85rem;transition:all 0.3s;">EMAIL US</a>' +
          '</section>';
        hideLoader();
      });
  </script>
</body>
</html>
