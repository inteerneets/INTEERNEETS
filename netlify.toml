# Netlify configuration
# Plain static site (no build step) + one function so the /admin editor can publish.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# /api/* -> the publish function (the editor calls /api/save-page etc.)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Never serve stale saved designs
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"
