backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ---------------------------------------------------------
  # ⚙️ SITE SETTINGS
  # ---------------------------------------------------------
  - name: "settings"
    label: "⚙️ Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "content/settings.json"
        fields:
          - { label: "Studio Name", name: "studio_name", widget: "string", default: "Studio" }
          - { label: "Tagline", name: "tagline", widget: "string", required: false }
          - { label: "Logo Image", name: "logo_image", widget: "image", required: false }

          - { label: "Primary / Accent Color", name: "primary_color", widget: "color", default: "#c9a96e" }
          - { label: "Background Color (Pure Hex)", name: "background_color", widget: "color", default: "#0a0a0a", hint: "Choose pure white #ffffff, pure black #000000, or any color without shading" }
          - { label: "Text Color", name: "text_color", widget: "color", default: "#f5f5f5" }
          - { label: "Card Color", name: "card_color", widget: "color", default: "#141414" }

          - { label: "Enable Background Dark Shading/Overlay", name: "enable_bg_overlay", widget: "boolean", default: false, hint: "Turn this OFF if you want pure 100% flat background colors with zero gray shading" }
          - { label: "Shading Opacity (if enabled)", name: "overlay_opacity", widget: "number", default: 0.5, value_type: "float", min: 0, max: 1, step: 0.05, required: false }

          - { label: "Show Shop Link in Navigation", name: "nav_show_shop", widget: "boolean", default: true }
          - { label: "Studio Contact Email", name: "contact_email", widget: "string", default: "inteerneets@gmail.com" }

          - { label: "Shopify Domain", name: "shopify_domain", widget: "string", required: false, hint: "e.g. your-store.myshopify.com" }
          - { label: "Shopify Storefront Access Token", name: "shopify_storefront_token", widget: "string", required: false }

          - { label: "Instagram URL", name: "social_instagram", widget: "string", required: false }
          - { label: "TikTok URL", name: "social_tiktok", widget: "string", required: false }
          - { label: "Twitter/X URL", name: "social_twitter", widget: "string", required: false }

  # ---------------------------------------------------------
  # 📄 HOME PAGE (COMING SOON)
  # ---------------------------------------------------------
  - name: "home_page"
    label: "📄 Home Page"
    files:
      - name: "home"
        label: "Home Page Elements"
        file: "content/home.json"
        fields:
          - { label: "Main Heading", name: "heading", widget: "string", default: "Coming Soon" }
          - label: "Heading Font"
            name: "heading_font"
            widget: "select"
            default: "Playfair Display"
            options: ["Playfair Display", "Inter", "Poppins", "Montserrat", "Oswald", "Raleway", "Space Grotesk"]
          - { label: "Heading Text Color", name: "heading_color", widget: "color", default: "#f5f5f5" }
          - { label: "Heading Size (rem)", name: "heading_size", widget: "number", default: 4.5, value_type: "float" }

          - { label: "Subtitle Text", name: "subtitle", widget: "text", default: "We're working on something special. Stay tuned." }
          - label: "Subtitle Font"
            name: "subtitle_font"
            widget: "select"
            default: "Inter"
            options: ["Inter", "Playfair Display", "Poppins", "Montserrat", "Oswald", "Raleway", "Space Grotesk"]
          - { label: "Subtitle Text Color", name: "subtitle_color", widget: "color", default: "#888888" }
          - { label: "Subtitle Size (rem)", name: "subtitle_size", widget: "number", default: 1.2, value_type: "float" }

          - { label: "Background Image", name: "background_image", widget: "image", required: false }

          - { label: "Show EMAIL US Button", name: "show_email_button", widget: "boolean", default: true }
          - { label: "Email Button Text", name: "email_button_text", widget: "string", default: "EMAIL US" }
          - { label: "Email Button Color", name: "email_button_color", widget: "color", default: "#c9a96e" }

          # Freeform Layer System (Drag/Reposition Text & Image Layers)
          - label: "Custom Freeform Layers"
            name: "custom_layers"
            widget: "list"
            hint: "Add text boxes or images with custom layering and placement on the home page"
            fields:
              - label: "Layer Type"
                name: "type"
                widget: "select"
                options: ["text", "image"]
                default: "text"
              - { label: "Text Content", name: "text", widget: "string", required: false }
              - { label: "Image File", name: "image", widget: "image", required: false }
              - label: "Font Family (if text)"
                name: "font_family"
                widget: "select"
                default: "Inter"
                options: ["Inter", "Playfair Display", "Poppins", "Montserrat", "Oswald", "Raleway", "Space Grotesk"]
                required: false
              - { label: "Text Color", name: "color", widget: "color", default: "#ffffff", required: false }
              - { label: "Font Size (rem)", name: "font_size", widget: "number", default: 1.0, value_type: "float", required: false }
              - { label: "Image Max Width (px)", name: "width", widget: "number", default: 200, required: false }
              - { label: "Top Position (% from top)", name: "top", widget: "number", default: 20, min: 0, max: 100 }
              - { label: "Left Position (% from left)", name: "left", widget: "number", default: 20, min: 0, max: 100 }
              - { label: "Layer Order (Z-Index: higher = on top)", name: "z_index", widget: "number", default: 5 }

  # ---------------------------------------------------------
  # 🛍️ SHOP (SHOPIFY ONLY)
  # ---------------------------------------------------------
  - name: "shop_page"
    label: "🛍️ Shop"
    files:
      - name: "shop"
        label: "Shop Page Content"
        file: "content/shop.json"
        fields:
          - { label: "Shop Title", name: "hero_title", widget: "string", default: "Shop" }
          - { label: "Shop Subtitle", name: "hero_subtitle", widget: "string", default: "Original works and exclusive merchandise" }

          - { label: "In-Person Section Title", name: "in_person_section_title", widget: "string", default: "Original Works" }
          - { label: "In-Person Section Subtitle", name: "in_person_section_subtitle", widget: "string", default: "One-of-a-kind pieces — ships directly from the studio" }

          - label: "Original Works (In-Person Pieces)"
            name: "in_person_items"
            widget: "list"
            summary: "{{fields.title}} - {{fields.price}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Shopify Product ID", name: "shopify_product_id", widget: "string", hint: "Direct checkout creates a ticket in your Shopify admin" }

          - { label: "Merch Section Title", name: "pod_section_title", widget: "string", default: "Merchandise" }
          - { label: "Merch Section Subtitle", name: "pod_section_subtitle", widget: "string", default: "Print-on-demand — ships worldwide" }

          - label: "Print-on-Demand Merch (Shopify)"
            name: "pod_products"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Shopify Product ID", name: "shopify_product_id", widget: "string" }
