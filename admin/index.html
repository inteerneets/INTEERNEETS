<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Content Manager</title>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Dark Mode Theme for Decap CMS -->
  <style>
    body { background-color: #121212 !important; color: #e0e0e0 !important; }
    /* Top App Bar & Sidebar */
    header, [class*="AppHeader"] { background-color: #1a1a1a !important; border-bottom: 1px solid #2a2a2a !important; }
    aside, [class*="SidebarContainer"] { background-color: #161616 !important; border-right: 1px solid #2a2a2a !important; }
    /* Cards, Forms, & Inputs */
    [class*="Card"], [class*="FieldContainer"], [class*="ControlContainer"] {
      background-color: #1e1e1e !important;
      border-color: #333 !important;
      color: #eee !important;
    }
    input, textarea, select {
      background-color: #282828 !important;
      border: 1px solid #444 !important;
      color: #f0f0f0 !important;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #c9a96e !important;
      outline: none !important;
    }
    /* Buttons */
    button[class*="Button"] {
      background-color: #2a2a2a !important;
      color: #f0f0f0 !important;
      border: 1px solid #444 !important;
    }
    button[class*="Button"]:hover {
      background-color: #c9a96e !important;
      color: #121212 !important;
    }
    /* Labels & Text */
    label, [class*="Label"] { color: #aaa !important; }
    h1, h2, h3, h4 { color: #f5f5f5 !important; }
    /* Preview Pane Container */
    [class*="PreviewPaneContainer"] {
      background-color: #0a0a0a !important;
      border-left: 2px solid #2a2a2a !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Live Visual Preview Component Registration -->
  <script>
    // Register site stylesheet into the live preview pane
    CMS.registerPreviewStyle('/css/style.css');

    // Home Page Live Visual Preview Template
    const HomePreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const heading = entry.getIn(['data', 'heading']) || 'Coming Soon';
        const headingFont = entry.getIn(['data', 'heading_font']) || 'Playfair Display';
        const headingColor = entry.getIn(['data', 'heading_color']) || '#f5f5f5';
        const headingSize = entry.getIn(['data', 'heading_size']) || 4.5;

        const subtitle = entry.getIn(['data', 'subtitle']) || '';
        const subtitleFont = entry.getIn(['data', 'subtitle_font']) || 'Inter';
        const subtitleColor = entry.getIn(['data', 'subtitle_color']) || '#888888';
        const subtitleSize = entry.getIn(['data', 'subtitle_size']) || 1.2;

        const bg = this.props.getAsset(entry.getIn(['data', 'background_image']));
        const emailBtnText = entry.getIn(['data', 'email_button_text']) || 'EMAIL US';
        const emailBtnColor = entry.getIn(['data', 'email_button_color']) || '#c9a96e';

        return h('div', {
          style: {
            minHeight: '100vh',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            textAlign: 'center',
            backgroundColor: '#0a0a0a',
            backgroundImage: bg ? 'url(' + bg.toString() + ')' : 'none',
            backgroundSize: 'cover',
            backgroundPosition: 'center',
            position: 'relative',
            padding: '24px'
          }
        },
          h('div', { style: { maxWidth: '750px', zIndex: 10 } },
            h('h1', {
              style: {
                fontFamily: headingFont + ', serif',
                color: headingColor,
                fontSize: headingSize + 'rem',
                letterSpacing: '2px',
                marginBottom: '16px',
                lineHeight: '1.1'
              }
            }, heading),
            h('p', {
              style: {
                fontFamily: subtitleFont + ', sans-serif',
                color: subtitleColor,
                fontSize: subtitleSize + 'rem',
                marginBottom: '40px'
              }
            }, subtitle),
            h('a', {
              href: '#',
              style: {
                display: 'inline-block',
                padding: '14px 40px',
                border: '1px solid ' + emailBtnColor,
                color: emailBtnColor,
                fontSize: '0.85rem',
                fontWeight: '600',
                letterSpacing: '1.5px',
                textTransform: 'uppercase',
                textDecoration: 'none',
                borderRadius: '4px'
              }
            }, emailBtnText)
          )
        );
      }
    });

    CMS.registerPreviewTemplate('home_page', HomePreview);
  </script>
</body>
</html>
