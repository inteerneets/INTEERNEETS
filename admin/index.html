<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INTEERNEETS — Page Editor</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- GrapesJS -->
  <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.13/dist/css/grapes.min.css" />
  <script src="https://unpkg.com/grapesjs@0.21.13/dist/grapes.min.js"></script>
  <script src="https://unpkg.com/grapesjs-blocks-basic@1.0.2/dist/index.js"></script>

  <!-- Editor theme -->
  <link rel="stylesheet" href="editor.css" />
</head>
<body>

  <!-- ─── Top Bar ─── -->
  <div class="top-bar">
    <div class="top-bar-left">
      <span class="logo">INTEERNEETS</span>
      <div class="page-tabs">
        <button class="page-btn active" data-page="home">Home Page</button>
        <button class="page-btn" data-page="shop">Shop Page</button>
      </div>
    </div>

    <div class="top-bar-right">
      <button id="btn-add-text" class="tb-btn" title="Add a new draggable text box">+ Text</button>
      <button id="btn-add-image" class="tb-btn" title="Add a new draggable image">+ Image</button>
      <button id="btn-freedrag" class="tb-btn" title="Drag elements anywhere on the page">&#10021; Free Drag</button>
      <button id="btn-upload" class="tb-btn" title="Upload images or fonts (.woff .woff2 .ttf .otf)">&#8682; Upload</button>
      <input type="file" id="upload-input" multiple accept="image/*,.woff,.woff2,.ttf,.otf" hidden />
      <button id="btn-undo" class="tb-btn" title="Undo">&#8630; Undo</button>
      <button id="btn-redo" class="tb-btn" title="Redo">&#8631; Redo</button>
      <button id="btn-preview" class="tb-btn" title="Preview">&#9654; Preview</button>
      <button id="btn-save" class="tb-btn save-btn" title="Save (Ctrl+S)">&#128190; Save</button>
      <button id="btn-reset" class="tb-btn" title="Reset page to default">&#8634; Reset</button>
      <button id="btn-settings" class="tb-btn settings-btn" title="Settings">&#9881;</button>
    </div>
  </div>

  <!-- ─── GrapesJS Container ─── -->
  <div id="gjs"></div>

  <!-- ─── Settings Modal ─── -->
  <div id="settings-overlay" class="settings-overlay hidden">
    <div class="settings-modal">
      <div class="settings-header">
        <h2>Site Settings</h2>
        <button id="settings-close" class="settings-close-btn">&times;</button>
      </div>

      <div class="settings-body">
        <label>Contact Email</label>
        <input type="email" id="set-email" value="inteerneets@gmail.com" />

        <label>Shopify Domain</label>
        <input type="text" id="set-shopify-domain" placeholder="your-store.myshopify.com" />

        <label>Shopify Storefront Token</label>
        <input type="text" id="set-shopify-token" placeholder="storefront access token" />

        <label>Product IDs <small>(one per line)</small></label>
        <textarea id="set-product-ids" rows="4" placeholder="gid://shopify/Product/123456&#10;gid://shopify/Product/789012"></textarea>

        <label>Instagram URL</label>
        <input type="url" id="set-instagram" placeholder="https://instagram.com/..." />

        <label>TikTok URL</label>
        <input type="url" id="set-tiktok" placeholder="https://tiktok.com/@..." />

        <label>Twitter URL</label>
        <input type="url" id="set-twitter" placeholder="https://twitter.com/..." />

        <label>Site Background Color <small>(exact color, no tint)</small></label>
        <input type="color" id="set-bg-color" value="#0a0a0a" />

        <label class="check-row"><input type="checkbox" id="set-bg-shading" /> Add dark shading overlay (off = pure flat color)</label>
      </div>

      <div class="settings-footer">
        <button id="settings-save" class="settings-save-btn">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- ─── Toast ─── -->
  <div id="toast" class="toast hidden"></div>

  <!-- ─── Editor logic ─── -->
  <script src="editor.js"></script>
</body>
</html>
